<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="css/catalogo.css">
    <link rel="shortcut icon" href="imagens/favicon.png" type="image/x-icon">
</head>
<body>
    <header class="Cabeçalho">

        <nav class="navegar">
            <a href="#" id="animax">ANIMAX</a>

            <div class="search-box">
                <input type="text" placeholder="Search animes..." >
                <button>🔍</button>
            </div>

            <ul class="nav-links">
                <a href="index.html">Home</a>
                <a href="catalogo.html">Catalog</a>
                <a href="#">Season</a>
                <a href="#">My account</a>
            </ul>

            <div class="nav-actions">
                <a href="Login/login.html"><button class="btn-login">Login</button></a>
                <a href="Login/register.html"><button class="btn-criar">Create account</button></a>
            </div>
        </nav>
    </header>
    <div class="filtros">
        <h4>Filters</h4>
    <select id="filtro-genero">
    <option value="todos">Genres</option>
    <option value="1">Action</option>
    <option value="2">Adventure</option>
    <option value="4">Comedy</option>
    <option value="8">Drama</option>
    <option value="10">Fantasy</option>
    <option value="14">Horror</option>
    <option value="22">Romance</option>
    <option value="24">Sci-Fi</option>
    <option value="36">Slice of Life</option>
    <option value="37">Sobrenatural</option>
    <option value="41">Suspense</option>
    <option value="30">Sports</option>
    <option value="17">Martial Arts</option>
    <option value="19">Music</option>
    
    
</select>

<select id="filtro-avaliacao">
    <option value="todos">Ratings</option>
    <option value="9">9.0+</option>
    <option value="8">8.0+</option>
    <option value="7">7.0+</option>
</select>

<select id="filtro-ano">
    <option value="todos">Year</option>
    <option value="2024">2024</option>
    <option value="2023">2023</option>
    <option value="2020">2020</option>
    <option value="2016">2016</option>
    <option value="2013">2013</option>
</select>

<select id="filtro-status">
    <option value="todos">Status</option>
    <option value="complete">Complete</option>
    <option value="airing">Airing</option>
</select>

<select id="filtro-tipo">
    <option value="todos">Type</option>
    <option value="tv">TV</option>
    <option value="movie">Movie</option>
</select>

<select id="filtro-ordem">
    <option value="padrao">Order </option>
    <option value="score-desc">Highest score</option>
    <option value="score-asc">Lowest score</option>
    <option value="title-asc">A-Z</option>
    <option value="title-desc">Z-A</option>
    <option value="start-date-desc">Newest</option>
    <option value="start-date-asc">Oldest</option>
</select>
    </div>

    <section class="animes">
        <div class="anime-list">

        </div>
    </section>

    <div class="paginacao">
        <button id="btn-anterior">Previous</button>
        <div class="caixa-pagina">
            <input type="number" id="numero-pagina" value="1" min="1">
        </div>
        <button id="btn-proximo">Next</button>
    </div>

    <script src="js/catalogo.js"></script>
</body>
</html>
