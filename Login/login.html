<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animax</title>
    <link rel="stylesheet" href="../css/stylelg.css">
    <link rel="shortcut icon" href="../imagens/favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
        <h1 id="titulo">ANIMAX</h1>

    <main>
        <div>
            <img src="imagens/logo.png" alt="" id="logo">
        </div>
        <h2>LOGIN</h2>
        <p id="desc">Acess your account to continue</p>

        <form action="" method="post" autocomplete="off">
            <div class="input-group">

                <label for="iemail">Email</label>

                    <i class="fa-regular fa-envelope"></i>

                    <input type="email" name="email" id="iemail" required placeholder="Email">

                <br>

                <label for="isenha">Password</label>

                    <i class="fa-solid fa-lock"></i>

                    <input type="password" name="senha" id="isenha" autocomplete="current-password" required placeholder="Password">

                    <i class="fa-regular fa-eye toggle-password eye-senha" data-target="isenha"></i>

                    <p class="forgot-area">
                        <a href="forgot.html" class="forgot-password">Forgot your password?</a>
                    </p>

                    <button type="submit" class="loginButtonFetch">
                    Login
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
            </div>
            </form>

            <section class="divisao">
                <div></div>
                <p>or</p>
                <div></div>
            </section>

            <p>Don't have an account yet?<a href="register.html"> Create account</p></a>
    </main>
    <p id="copyright">© 2026 Animax. All rights reserved</p>

    <script src="../js/scriptlg.js"></script>
</body>
</html>
