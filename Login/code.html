<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animax</title>
    <link rel="stylesheet" href="../css/stylecd.css">
    <link rel="shortcut icon" href="../imagens/favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <section class="auth-page">
        <h1 id="titulo">ANIMAX</h1>
        <main>
            <div>
                <img src="imagens/logo.png" alt="" id="logo">
            </div>
                <h2>Enter the code</h2>
                <p id="desc">Enter the six-digit code sent to your email so we can confirm your identity.</p>
                <form action="new-password.html" method="get" autocomplete="off">

                    <div class="code-box">
                        <input type="text" name="c1" maxlength="1" required>
                        <input type="text" name="c2" maxlength="1" required>
                        <input type="text" name="c3" maxlength="1" required>
                        <input type="text" name="c4" maxlength="1" required>
                        <input type="text" name="c5" maxlength="1" required>
                        <input type="text" name="c6" maxlength="1" required>
                    </div>
                        <button type="submit">
                            VERIFY
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>

                    </div>
                </form>

                    <br>
                    <br>

                    <p>Didn't receive it? <a href="">Send again</a></p>
        </main>
        <p id="copyright">© 2026 Animax. All rights reserved</p>
    </section>

    <script src="../js/scriptcode.js"></script>
</body>
</html>
