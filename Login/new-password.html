<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animax</title>
    <link rel="stylesheet" href="n-pwstyle.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h1 id="titulo">ANIMAX</h1>

        <main>
            <img src="imagens/logo.png" alt="" id="logo">
            <h2>Criar nova senha</h2>
            <p id="desc">Digite sua nova senha abaixo para recuperar o aceeso à sua conta</p>

            <form action="password-created.html" method="get">
                <div class="input-group">
                    <label for="inovasenha">Nova senha</label>

                    <i class="fa-solid fa-lock"></i>
                    
                    <input type="password" name="novasenha" id="inovasenha" placeholder="Nova senha" required minlength="8">
                    <i class="fa-regular fa-eye icon-eye toggle-password eye-confirmar" data-target="iconfirmsenha"></i>

                    <br>
                    <label for="iconfirmsenha">Confirmar senha</label>

                    <i class="fa-solid fa-lock icon-left"></i>
                    <input type="password" name="confirmsenha" id="iconfirmsenha" placeholder="Confirmar senha" required minlength="8">
                    <i class="fa-regular fa-eye toggle-password eye-senha" data-target="inovasenha"></i>

                    
                    <button type="submit">
                        SALVAR NOVA SENHA
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </form>
        </main>
        <p id="copyright">© 2026 Animax. Todos os direitos resevados.</p>

        <script src="n-pw.js"></script>
</body>
</html>
