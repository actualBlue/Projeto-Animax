<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animax</title>
    <link rel="stylesheet" href="../css/stylerg.css">
    <link rel="shortcut icon" href="../imagens/favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
</head>
<body>
  
        <h1 id="titulo">ANIMAX</h1>
        <main>
            <div>
                <img src="imagens/logo.png" alt="" id="logo">
            </div>
            <h2>Create account</h2>
            <p id="desc">Join the anime community</p>
            <form action="" method="get" autocomplete="off">
                <div class="input-group">
                    <label for="iusuario">Username</label>
        
                        <i class="fa-regular fa-user"></i>
                        <input type="text" name="usuario" id="iusuario" required placeholder="Username">
        
                    <br>
                    <label for="iemail">Email</label>
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" name="email" id="iemail" required placeholder="E-mail">
                    <br>
                    <label for="isenha">Password</label>
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="senha" id="isenha" placeholder="Password" minlength="8" required>
                    <i class="fa-regular fa-eye toggle-password eye-senha" data-target="isenha"></i>
                    <br>
                    <label for="iconfsenha">Confirm password</label>
                    <i class="fa-solid fa-lock icon-left"></i>
                    <input type="password" name="confsenha" id="iconfsenha" placeholder="Confirm password" minlength="8" required>
                    <i class="fa-regular fa-eye icon-eye toggle-password eye-confirmar" data-target="iconfsenha"></i>
                    </div>

                    <div class="erro">
                        
                    </div>

                    <button type="button" class="registerButton">
                        CREATE ACCOUNT
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
                <section class="divisao">
                    <div></div>
                    <p>or</p>
                    <div></div>
                </section>
                <p>Already have an account? <a href="login.html">Login</a></p>
            </main>
            <p id="copyright">© 2026 Animax. All rights reserved.</p>

        <script src="../js/scriptrg.js"></script>
    </body>
</html>
