<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animax</title>
    <link rel="stylesheet" href="../css/stylefgt.css">
    <link rel="shortcut icon" href="../imagens/favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <section class="auth-page">
        <h1 id="titulo">ANIMAX</h1>
        <main>
            <div>
                <img src="imagens/logo.png" alt="" id="logo">
            </div>
                <h2>Forgot your password?</h2>
                <p id="desc">Enter your account email address and we'll send you a link to reset your password.</p>
                <form action="code.html" method="get" autocomplete="off">
                    <div class="input-group">
                        <label for="iemail">Email</label>
        
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" name="email" id="iemail" required placeholder="Email">
                        <br>
                        <button type="submit">
                            Send link
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </form>
                    <section class="divisao">
                        <div></div>
                        <p>or</p>
                        <div></div>
                    </section>
                    <p>Go back to <a href="login.html">Login</a></p>
        </main>
        <p id="copyright">© 2026 Animax. All rights reserved</p>
    </section>
</body>
</html>
