<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animax</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="Cabeçalho">

        <nav class="navegar">
            <a href="#" id="animax">ANIMAX</a>

            <div class="search-box">
                <input type="text" placeholder="Search animes..." >
                <button>🔍</button>
            </div>

            <ul class="nav-links">
                <a href="index.html">Home</a>
                <a href="catalogo.html">Catalog</a>
                <a href="#">Season</a>
                <a href="#">My account</a>
            </ul>

            <div class="nav-actions">
                <a href="Login/login.html"><button class="btn-login">Login</button></a>
                <a href="Login/register.html"><button class="btn-criar">Create account</button></a>
            </div>
        </nav>
    </header>

    <section class="destaques" id="destaques">
        <div class="content">
            <span class="tag">Featured</span>

            <h1 id="titulo"></h1>

            <div class="anime-info">
                <span id="ano"></span>
                <span id="idade"></span>
                <span id="episodios"></span>
                <span id="avaliacao"></span>
            </div>

            <div class="generos" id="anime-generos"></div>
                
                <p id="descricao"></p>

                <div class="botoes">
                    <button class="btn-primario">See details</button>
                    <button class="btn-secundario" id="btn-detalhes">Favorite</button>
            </div>
        </div>
    </section>

    <section class="anime-section-trending">
        <div class="section-header">
            
            <h2>Trending</h2>
            <a href="#">See all</a>
        </div>

        <div class="card-carousel">
            <button class="carousel-arrow carousel-prev" id="trending-prev">‹</button>

            <div class="anime-list" id="trending-list"></div>

            <button class="carousel-arrow carousel-next" id="trending-next">›</button>
        </div>
        
    </section>
    
    <section class="anime-area-news">
        
        <div class="anime-section-news">
            <div class="section-news-header">
                <h2>Recent releases</h2>
                <a href="#">See all</a>
        </div>

        <div class="card-carousel">
            <div class="carousel-arrow carousel-prev" id="launch-prev">‹</div>
            
                <div class="anime-list-news" id="launch-list"></div>

                <div class="carousel-arrow carousel-next" id="launch-next">›</div>
            </div>
        

    </section>
    
    <div class="rate-row">
        <section class="anime-area-rate">
            <div class="section-rate-title">
                <h2>Top rated</h2>
            </div>
            <div class="section-rate-link left-link">
                <a href="#">See all</a>
            </div>
                <div class="anime-list-rate" id="rate-list">
            </div>

        </section>

        

        <section class="anime-area-simi anime-area-parecidos">
            <div class="section-simi-title">
                <h2>Similar to you</h2>
            </div>
            <div class="section-simi-link right-link">
                <a href="#">See all</a>
            </div>
            <div class="anime-list-simi" id="parecidos-list"></div>
        </section>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
